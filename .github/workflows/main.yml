name: Build Overdesk Copilot Windows Setup

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install --no-audit --no-fund
          npm install -D electron electron-builder

      - name: Build Web Assets & Server
        run: npm run build

      - name: Package Windows Setup (.exe)
        run: npx electron-builder --win nsis --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: Overdesk-Copilot-Windows-Setup
          path: |
            dist_electron/*Setup*.exe
          retention-days: 14
